[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools_scm[toml]>=6.2", "wheel"]

[project]
authors = [{ name = "TestFLARE Team" }]
dependencies = [
  "GitPython>=3.1.45",
  "coverage>=7",
  "dotenv>=0.9.9",
  "nltk>=3.9",
  "pandas>=2.3",
  "pytest>=7",
  "pyyaml>=5",
  "scikit-learn>1",
  "sqlalchemy>=2",
  "unidiff>=0.7.5",
  "importlib_metadata",
]
description = "Pytest plugin implementing flaky test failure detection and classification."
dynamic = ["version"]
license-files = ["LICENSE"]
name = "pytest-flakefighters"
readme = "README.md"
requires-python = ">=3.9"

[project.entry-points.pytest11]
flakefighters = "pytest_flakefighters.main"

[project.entry-points."pytest_flakefighters"]
CosineSimilarity = "pytest_flakefighters.flakefighters.traceback_matching:CosineSimilarity"
CoverageIndependence = 'pytest_flakefighters.flakefighters.coverage_independence:CoverageIndependence'
DiffCov = "pytest_flakefighters.flakefighters.diff_cov:DiffCov"
TracebackMatching = "pytest_flakefighters.flakefighters.traceback_matching:TracebackMatching"

[project.optional-dependencies]
pg = ["psycopg2>2.9"]
scipy = ["scipy"]

[dependency-groups]
dev = [
  "myst_parser",
  "nbsphinx",
  "pre_commit",
  "pytest-cov",
  "pytest-html",
  "pytest-json-report>=1.5",
  "sphinx-autoapi",
  "sphinx_rtd_theme",
  "autoclasstoc",
  "tox",
  "pytest-mock",
  "taskipy>=1.14.1",
  "ruff>=0.16.10",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Documentation = "https://pytest-flakefighters.readthedocs.io"
Homepage = "https://test-flare.github.io/"
Issues = "https://github.com/test-flare/pytest-flakefighters/issues"
Repository = "https://github.com/test-flare/pytest-flakefighters"

[tool.taplo]
reorder_keys = true
reorder_arrays = true

[tool.ruff]
# https://docs.astral.sh/ruff/
extend-exclude = ["tests/resources"]
line-length = 120

[tool.ruff.lint]
# Ruff's default rules, plus the checks pylint used to enforce.
extend-select = [
  "ARG",
  "B",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "UP",
  "W",
]
# DTZ: timezone-aware datetimes will be handled in a separate PR.
# FA100: no longer applies once Python 3.9 support is dropped.
# RUF009: false positive on SQLAlchemy Column() defaults in the dataclass models.
ignore = ["DTZ", "FA100", "RUF009"]

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["D100"]
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.taskipy.tasks]
all = "task format-check && task lint && task test"
format = "ruff format"
format-check = "ruff format --check"
lint = "ruff check"
lint-fix = "ruff check --fix"
test = "pytest -p no:flakefighters --cov=src --cov-report=xml"

[tool.setuptools_scm]
write_to = "src/_version.py"

[tool.tox]
env_list = ["3.10", "3.11", "3.12", "3.13", "3.14"]
requires = ["tox>=4.19"]
skip_missing_interpreters = false                   # fail if devs don’t have all required Python versions

# Base configuration for all test environments
[tool.tox.env_run_base]
allowlist_externals = ["pytest"]
commands = [
  [
    "pytest",
    "--cov-report=html",
    "--cov=src/pytest_flakefighters",
    "-p",
    "no:flakefighters",
    "{posargs:tests}",
  ],
]
deps = ["pytest", "pytest-cov", "pytest-html", "pytest-json-report"]
description = "Run pytest under {base_python}"
extras = ["dev", "scipy"]
usedevelop = true
